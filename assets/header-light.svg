      <stop stop-color="#d9822b"/><stop offset="0.42" stop-color="#7954d6"/><stop offset="1" stop-color="#1688b5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b7be0" stop-opacity="0.12"/><stop offset="1" stop-color="#8b7be0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#65749b" opacity="0.15"/>
    </pattern>
  </defs>
