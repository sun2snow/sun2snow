<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sun to Snow — sun2snow</title>
  <desc id="desc">An ice-blue and violet circuit connects a warm orange sun to a snowflake on a pale background.</desc>
