    <text x="41" y="124" fill="#202d48" font-size="62" font-weight="700" letter-spacing="-2">sun2snow<tspan fill="#1688b5">_</tspan></text>
    <text x="44" y="169" fill="#586886" font-size="16">A little warmth. A little winter.</text>
  </g>
