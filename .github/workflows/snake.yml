name: Update contribution snake

on:
  schedule:
    # Multiple refresh opportunities per day if GitHub delays/drops an event.
    # UTC; staggered from stats and away from the start of the hour.
    - cron: '53 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the publisher
        run: python3 -m unittest discover -s tests -v

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb86b&color_dots=#161b22,#29385d,#5363a4,#9581e8,#79dcff
            dist/snake-light.svg?palette=github-light&color_snake=#d9822b&color_dots=#ebedf0,#dce4fa,#a8bbed,#8b7ad3,#1688b5

      - name: Publish snakes without replacing the cards
        run: >-
          python3 scripts/publish_assets.py
          dist/snake-dark.svg dist/snake-light.svg
          --message 'chore: refresh contribution snake'
